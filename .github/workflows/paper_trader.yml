name: QuantPilot AI - 24/7 Cloud Paper Trader

# NOT: Otomatik zamanlama (schedule) ve her push'ta calisma KAPATILDI.
# Streamlit Cloud uygulamasi zaten kendi icinde 7/24 paper worker calistiriyor
# (quantpilot/embedded_worker.py). Bu is akisi AYRI bir SQLite veritabani kullandigi icin
# ikisi birlikte calisirsa ayni Alpaca hesabinda iki bagimsiz bot islem yapar ve paneldeki
# "Acil Durdur" bu botu DURDURAMAZ. Yalnizca Streamlit kullanilmiyorsa, asagidaki schedule
# satirlarini geri acin ve Streamlit uygulamasini kapatin.
#
#  schedule:
#    - cron: "*/15 13-21 * * 1-5"
"on":
  workflow_dispatch:
    inputs:
      force_eval:
        description: "Piyasa kapali olsa bile sinyal taramasini zorla"
        required: false
        default: "true"

concurrency:
  group: quantpilot-paper-worker
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Veritabani ve ML model onbellegini geri yukle
        uses: actions/cache@v4
        with:
          path: |
            data
            models
          key: qp-state-${{ github.run_number }}
          restore-keys: |
            qp-state-

      - name: QuantPilot AI Paper Trading dongusunu calistir
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
          ALPACA_DATA_FEED: "iex"
          ALPACA_HISTORICAL_FEED: "sip"
          QP_CLOUD_AUTO: "true"
          QP_FORCE_EVAL: ${{ github.event.inputs.force_eval || 'false' }}
        run: python -m quantpilot.cloud_run
